<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay — Stromation</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#0b0d10;--line:#1e232b;--text:#c9d1d9;--dim:#7d8590;
        --faint:#4b5460;--amber:#f0a832;
        --mono:ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0}
  body{background:var(--ink);color:var(--text);font-family:var(--mono);
       font-size:13px;min-height:100vh;display:flex;flex-direction:column;
       align-items:center;padding:14px}
  header{width:100%;max-width:900px;display:flex;gap:12px;align-items:baseline;
         flex-wrap:wrap;padding-bottom:12px}
  .mark{letter-spacing:.28em;font-weight:700;font-size:12px}
  .mark small{color:var(--amber)}
  header a{margin-left:auto;color:var(--dim);text-decoration:none}
  header a:hover{color:var(--amber)}
  #stage{image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;
         width:min(88vw,432px);height:auto;background:#000}
  #controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
            justify-content:center;padding:14px 0}
  select,button{font-family:var(--mono);font-size:12px;background:#12151a;
                color:var(--text);border:1px solid var(--line);border-radius:6px;
                padding:7px 12px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  button:disabled{opacity:.4;cursor:default}
  button.rec{border-color:#e5534b;color:#e5534b}
  button.rec.on{background:#e5534b;color:#fff}
  #hint{color:var(--faint);font-size:11px;text-align:center;max-width:460px;
        line-height:1.6;padding-bottom:20px}
</style>
</head>
<body>
<header>
  <span class="mark">STROMATION <small>/ REPLAY</small></span>
  <a href="index.html">← live</a>
</header>

<canvas id="stage" width="540" height="960"></canvas>

<div id="controls">
  <select id="session"></select>
  <button id="play">▶ play</button>
  <select id="speed">
    <option value="1">1×</option>
    <option value="3" selected>3×</option>
    <option value="8">8×</option>
    <option value="20">20×</option>
  </select>
  <button id="voice">🔊 voice: on</button>
  <button id="rec" class="rec">● record</button>
  <a id="dl" style="display:none"></a>
  <audio id="vo" crossorigin="anonymous" preload="auto"></audio>
</div>
<div id="hint">9:16, ready to post. <b>Record</b> plays the session from the
  start and downloads a .webm when it ends — captions are drawn into the
  frame, so the file is complete on its own.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const URL_='https://oushyhkmekemygzxvabh.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91c2h5aGttZWtlbXlnenh2YWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTM0NDAsImV4cCI6MjEwMTY4OTQ0MH0.bvm3rJF6rY6_tL3Ra_AJgd0b3vkajt4J0Fs8MjhsvTg';
const sb=window.supabase.createClient(URL_,KEY);
const $=id=>document.getElementById(id);
const cv=$('stage'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;

/* ---- geometry: 540x960 vertical. office band, then narration ---- */
const S=3, OX=0, OY=150, W=180, H=120;      // office: 540x360 at y=150
const state={sprite:null,name:'Sol',day:1,live:false,lastTool:null,
  pos:{x:10,y:78},target:{x:110,y:74},walking:false,step:0,
  caption:'',sub:'',turns:0,cost:0,title:'',cta:false};
const SPOTS={out:{x:6,y:78},door:{x:22,y:78},desk:{x:112,y:74},
             window:{x:140,y:52},coffee:{x:46,y:96}};

function px(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(OX+x*S,OY+y*S,w*S,h*S)}
function shade(hex,f){const n=parseInt(hex.slice(1),16);
  return `rgb(${(n>>16)*f|0},${((n>>8)&255)*f|0},${(n&255)*f|0})`}
function isTyping(){return ['Bash','Write','Edit'].includes(state.lastTool)}

function drawOffice(){
  const dark=!state.live, sh=c=>shade(c,dark?.35:1);
  px(0,0,W,H,sh('#141821'));                       // wall
  px(0,62,W,H-62,sh('#1d232e'));                   // floor
  for(let i=0;i<W;i+=10)px(i,62,1,H-62,sh('#171c26'));
  px(126,20,32,22,sh('#0a0c10'));px(128,22,28,18,dark?'#0d1220':'#2c4a6e');
  px(141,22,1,18,sh('#0a0c10'));px(128,30,28,1,sh('#0a0c10'));
  px(14,52,16,26,sh('#2a2117'));px(27,64,2,4,sh('#f0a832'));     // door
  px(100,72,30,3,sh('#4a3826'));px(102,75,2,9,sh('#33261a'));
  px(126,75,2,9,sh('#33261a'));                                   // desk
  px(109,65,12,7,sh('#0a0c10'));
  px(110,66,10,5,state.live&&isTyping()?'#7fd0a0':sh('#1a212c'));  // screen
  px(40,90,12,3,sh('#3a3a44'));px(44,86,3,4,sh('#c9d1d9'));       // coffee
  px(86,6,10,2,sh('#3a3f4a'));
  if(state.live){cx.fillStyle='rgba(240,200,120,0.06)';cx.beginPath();
    cx.moveTo(OX+91*S,OY+8*S);cx.lineTo(OX+72*S,OY+62*S);
    cx.lineTo(OX+112*S,OY+62*S);cx.fill()}
}
function drawStro(){
  const p=state.pos,bob=state.walking?(state.step>>3)%2:0;
  if(!state.sprite){cx.strokeStyle='#4b5460';cx.setLineDash([3,3]);
    cx.strokeRect(OX+(p.x-8)*S,OY+(p.y-16+bob)*S,16*S,16*S);
    cx.setLineDash([]);return}
  const {palette,grid}=state.sprite;
  for(let r=0;r<16;r++)for(let c=0;c<16;c++){const v=grid[r][c];
    if(v)px(p.x-8+c,p.y-16+r+bob,1,1,palette[v-1]||'#fff')}
}
function wrap(text,maxw,font){
  cx.font=font;const words=String(text).split(/\s+/),lines=[];let line='';
  for(const w of words){const t=line?line+' '+w:w;
    if(cx.measureText(t).width>maxw&&line){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);return lines;
}
function frame(){
  cx.fillStyle='#0b0d10';cx.fillRect(0,0,540,960);
  // header
  cx.fillStyle='#f0a832';cx.font='700 15px ui-monospace,monospace';
  cx.fillText('STROMATION', 26, 46);
  cx.fillStyle='#4b5460';cx.font='13px ui-monospace,monospace';
  cx.fillText(`DAY ${state.day}${state.title?' · '+state.title:''}`, 26, 70);
  cx.fillStyle='#7d8590';cx.font='13px ui-monospace,monospace';
  const w=cx.measureText(state.name).width;cx.fillText(state.name, 514-w, 46);
  const stat=state.live?'AT WORK':'OFFICE DARK';
  const w2=cx.measureText(stat).width;
  cx.fillStyle=state.live?'#f0a832':'#4b5460';
  cx.font='11px ui-monospace,monospace';cx.fillText(stat, 514-w2, 70);
  // office
  drawOffice();
  drawStro();   // he does not blink out of existence between beats
  cx.strokeStyle='#1e232b';cx.strokeRect(0,OY,540,H*S);
  // narration
  let y=OY+H*S+56;
  if(state.cta){
    cx.fillStyle='#f0a832';
    for(const l of wrap(state.caption,470,'700 30px ui-monospace,monospace')){
      cx.fillText(l,30,y+40);y+=42}
  } else {
    cx.fillStyle='#e8eaf0';
    for(const l of wrap(state.caption,470,'600 22px ui-monospace,monospace').slice(0,5)){
      cx.fillText(l,30,y);y+=32}
  }
  if(state.sub){
    y+=10;cx.fillStyle='#6b7480';
    for(const l of wrap(state.sub,470,'15px ui-monospace,monospace').slice(0,4)){
      cx.fillText(l,30,y);y+=22}
  }
  // footer books
  cx.fillStyle='#1e232b';cx.fillRect(0,896,540,1);
  cx.fillStyle='#4b5460';cx.font='13px ui-monospace,monospace';
  cx.fillText(`turn ${state.turns}`,30,928);
  const c=`$${state.cost.toFixed(2)} spent`;
  cx.fillText(c,510-cx.measureText(c).width,928);
}

/* ---- narration: his own words, never invented ---- */
function narrate(e){
  const k=e.kind, body=e.body||'', title=e.title||'';
  if(k==='session_start')return{cap:'Sol wakes up.',sub:''};
  if(k==='session_end')
    return{cap: title==='completed'?'He closes the laptop.':'The session ends.',
           sub: body};
  if(k==='thought')return{cap:body.slice(0,220),sub:''};
  if(k==='tool_use'){
    let d='';try{d=(JSON.parse(body)||{}).description||''}catch(_){}
    const short=title.replace('mcp__company__','');
    const verbs={set_appearance:'He decides what he looks like.',
      journal_write:'He writes in the journal.',
      memory_save:'He commits something to memory.',
      task_create:'He writes himself a task.',
      task_update:'He updates a task.',
      book_expense:'He books an expense.',
      escalate:'He walks to the owner’s door.',
      WebSearch:'He researches.',WebFetch:'He reads a page.'};
    return{cap: verbs[short] || d || `He runs ${short}.`,
           sub: verbs[short] && d ? d : ''};
  }
  return null;
}
function moveFor(e){
  if(e.kind==='session_start'){state.pos={...SPOTS.out};state.target={...SPOTS.desk};state.live=true}
  else if(e.kind==='session_end'){state.target={...SPOTS.out}}
  else if(e.kind==='thought'){state.target={...SPOTS.window}}
  else if(e.kind==='tool_use'){
    const t=(e.title||'');
    if(t.endsWith('escalate'))state.target={...SPOTS.door};
    else if(t.endsWith('set_appearance'))state.target={...SPOTS.coffee};
    else state.target={...SPOTS.desk};
    state.lastTool=t;
  }
}
function tick(){
  const p=state.pos,t=state.target,dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy);
  state.walking=d>1;
  if(state.walking){p.x+=dx/d*.6;p.y+=dy/d*.6;state.step++}
  frame();requestAnimationFrame(tick);
}

/* ---- playback ---- */
let events=[],playing=false,timer=null,recorder=null,chunks=[],narration=null;
let voiceOn=true, ukVoice=null, voicesReady=false;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  if(!vs.length)return;
  voicesReady=true;
  ukVoice = vs.find(v=>/en[-_]GB/i.test(v.lang)&&/(daniel|arthur|male|google uk english male)/i.test(v.name))
        || vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || vs[0] || null;
  $('voice').textContent = voiceOn
    ? '🔊 '+(ukVoice?ukVoice.name.slice(0,16):'default') : '🔇 voice off';
}
speechSynthesis.onvoiceschanged=pickVoice;
pickVoice(); setTimeout(pickVoice,300); setTimeout(pickVoice,1500);
setTimeout(()=>{ if(!voicesReady){
  $('voice').textContent='🔇 no voices';
  $('hint').innerHTML='Your browser has no built-in speech voices, so the '
    +'live <i>text-to-speech preview</i> is silent on this machine. '
    +'This does NOT affect voiced episodes (marked “· voiced”): press play '
    +'and the recorded clip includes their real narration audio. '
    +'(To enable the browser preview on Linux: <code>sudo apt install '
    +'speech-dispatcher espeak-ng</code>, then restart the browser.)';
}},2500);
function hasRealVoice(){return !!(narration&&narration.audio_url)}
function say(text){
  if(!voiceOn||!text||hasRealVoice())return;
  const u=new SpeechSynthesisUtterance(text);
  if(ukVoice)u.voice=ukVoice;
  u.lang='en-GB';u.rate=.88;u.pitch=.92;
  speechSynthesis.speak(u);
}
$('voice').onclick=()=>{voiceOn=!voiceOn;
  if(!voiceOn){speechSynthesis.cancel();$('voice').textContent='🔇 voice off'}
  else pickVoice()};
function stop(){playing=false;clearTimeout(timer);$('play').textContent='▶ play';
  if(!recorder||recorder.state!=='recording')$('vo').pause()}
async function play(fromRecord){
  if(playing&&!fromRecord){stop();return}
  playing=true;$('play').textContent='⏸ pause';
  state.turns=0;state.cost=0;state.live=false;state.pos={...SPOTS.out};
  state.caption='';state.sub='';state.cta=false;
  speechSynthesis.cancel();
  const vo=$('vo');
  if(hasRealVoice()){
    if(vo.src!==narration.audio_url)vo.src=narration.audio_url;
    vo.currentTime=0; vo.play().catch(()=>{});
  } else { vo.pause(); }
  // The documentary track, if the crew filmed this day: paragraphs are
  // spoken and captioned in step with the events beneath them.
  const paras = narration ? narration.script.split(/\n\s*\n/).filter(Boolean) : [];
  let pi=0, nextParaAt = paras.length ? Math.floor(events.length/paras.length) : Infinity;
  let i=0;
  const step=()=>{
    if(!playing||i>=events.length){
      state.live=false;state.target={...SPOTS.out};state.cta=true;
      state.caption='Watch him live at stromation.com';
      state.sub='He works 9 to 5, and wakes any hour a customer pays.';
      say('Watch him live, at stromation dot com.');
      stop();
      if(recorder&&recorder.state==='recording')setTimeout(()=>recorder.stop(),4500);
      return;
    }
    const e=events[i], nxt=events[i+1];
    if(paras.length && i>=pi*nextParaAt && pi<paras.length){
      const p=paras[pi++]; state.caption=p; state.sub=''; say(p);
    } else if(!paras.length){
      const n=narrate(e);
      if(n){state.caption=n.cap;state.sub=n.sub}
    } else {
      const n=narrate(e); if(n)state.sub=n.cap;   // literal action under the prose
    }
    moveFor(e);
    if(e.kind==='tool_use')state.turns++;
    if(e.kind==='session_end'){
      const m=(e.body||'').match(/\$([\d.]+)/);if(m)state.cost=parseFloat(m[1]);
      state.live=false;
    }
    i++;
    let waitMs;
    if(hasRealVoice()&&$('vo').duration){
      waitMs=Math.max(320,($('vo').duration*1000)/Math.max(events.length,1));
    } else {
      const speed=+$('speed').value;
      const gapMs=nxt?Math.min(new Date(nxt.ts)-new Date(e.ts),4000):1800;
      waitMs=Math.max(700,gapMs)/speed;
    }
    timer=setTimeout(step,waitMs);
  };
  step();
}
$('play').onclick=()=>play(false);
$('speed').onchange=()=>{};
$('rec').onclick=()=>{
  if(recorder&&recorder.state==='recording'){recorder.stop();return}
  chunks=[];
  const stream=cv.captureStream(30);
  try{
    if(hasRealVoice()){
      const ac=window._ac||(window._ac=new AudioContext());
      const src=window._voSrc||(window._voSrc=ac.createMediaElementSource($('vo')));
      const dest=ac.createMediaStreamDestination();
      src.connect(dest); src.connect(ac.destination);
      dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
      if(ac.state==='suspended')ac.resume();
    }
  }catch(e){console.warn('audio mix unavailable',e)}
  // Pick a mime that actually encodes the AUDIO track too. 'codecs=vp9'
  // alone left some browsers recording video-only; naming opus guarantees
  // the narration lands in the file, with graceful fallbacks.
  let mime='video/webm;codecs=vp9,opus';
  if(!MediaRecorder.isTypeSupported(mime))mime='video/webm;codecs=vp8,opus';
  if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';
  recorder=new MediaRecorder(stream,{mimeType:mime,
                                     videoBitsPerSecond:6_000_000});
  recorder.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data)};
  recorder.onstop=()=>{
    $('vo').pause();
    $('rec').classList.remove('on');$('rec').textContent='● record';
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=$('dl');a.href=URL.createObjectURL(blob);
    a.download=`stromation-day${state.day}.webm`;a.click();
  };
  recorder.start();
  $('rec').classList.add('on');$('rec').textContent='■ stop';
  stop();play(true);
};

/* ---- load ---- */
async function load(){
  const emp=await sb.from('employees').select('name,sprite')
    .eq('role','Founder & CEO').limit(1).single();
  if(emp.data){state.name=emp.data.name;state.sprite=emp.data.sprite}
  // Episodes, not wakeups. Ticks now outnumber focus blocks ~50:1 and only
  // a focus block is filmed, so listing every wakeup filled this with
  // dozens of numbered entries that had nothing to play.
  const nar=await sb.from('narrations')
    .select('wakeup_id,day,title,audio_url,created_at')
    .order('created_at',{ascending:true});
  const eps=(nar.data||[]).filter(n=>n.wakeup_id);
  const sel=$('session');
  eps.forEach((n,idx)=>{
    const o=document.createElement('option');o.value=n.wakeup_id;
    const d=new Date(n.created_at).toLocaleDateString();
    o.textContent=`${idx+1}. ${n.title||'untitled'} — ${d}`
                  +(n.audio_url?' · voiced':'');
    o.dataset.day=n.day||idx+1;
    o.dataset.date=(n.created_at||'').slice(0,10);
    sel.appendChild(o);
  });
  if(!eps.length){
    const o=document.createElement('option');
    o.textContent='no episodes filmed yet';
    sel.appendChild(o);$('play').disabled=true;$('rec').disabled=true;return;
  }
  sel.value=eps[eps.length-1].wakeup_id;
  await loadSession();
  sel.onchange=loadSession;
}

async function loadSession(){
  stop();
  const sel=$('session');
  const opt=sel.selectedOptions[0];
  state.day=+opt.dataset.day||1;
  // An episode now covers a whole DAY, not one wake-up, so its events are
  // every event of that date rather than one session's.
  const d=opt.dataset.date;
  const [{data},nar]=await Promise.all([
    sb.from('events').select('*')
      .gte('ts',d+'T00:00:00Z').lt('ts',d+'T23:59:59Z')
      .order('id',{ascending:true}),
    sb.from('narrations').select('title,script,day,audio_url')
      .eq('wakeup_id',sel.value).maybeSingle(),
  ]);
  events=data||[];
  narration=nar.data||null;
  state.title = narration ? narration.title : '';
  state.caption = narration ? `“${narration.title}”` : `Day ${state.day}.`;
  state.sub = narration
    ? (narration.audio_url?'🎙 voiced · press play':'press play')
    : `${events.length} moments · press play`;
  $('vo').src = narration&&narration.audio_url ? narration.audio_url : '';
}
load().then(()=>tick());
</script>
</body>
</html>
